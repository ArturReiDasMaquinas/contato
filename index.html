<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Artur</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41;
            --dark: #0a0a0a;
            --light: #ffffff;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--dark); 
            color: var(--light);
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .contact-card { 
            background: #121212; 
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            border: 1px solid #222;
            max-width: 400px;
            width: 90%;
        }
        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 20px; }
        p { margin: 10px 0; }
        .info { margin: 25px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 20px 0; }
        .whatsapp-link { 
            display: inline-block; 
            padding: 15px 30px; 
            background: var(--primary); 
            color: var(--dark); 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 10px;
            transition: 0.3s;
        }
        .whatsapp-link:hover { background: #00cc33; transform: scale(1.05); }
        .secret-btn {
            margin-top: 50px;
            color: #ff0000;
            text-decoration: none;
            font-size: 0.7rem;
            background: #200000;
            padding: 5px 10px;
            border-radius: 3px;
            opacity: 0.2;
            transition: 0.3s;
        }
        .secret-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <section id="contato">
        <div class="contact-card">
            <h2>CONTATO</h2>
            <p>Atendimento em <strong>Vilhena - RO</strong></p>
            <div class="info">
                <p>📞 WhatsApp: <strong>(69) 9201-8730</strong></p>
                <p>🔧 Manutenção e Serviços Técnicos</p>
            </div>
            <a href="https://wa.me/556992018730" target="_blank" rel="noopener noreferrer" class="whatsapp-link">CHAMAR NO WHATSAPP</a>
        </div>
    </section>

    <a href="secreto.html" class="secret-btn">ÁREA RESTRITA</a>

</body>
</html>
