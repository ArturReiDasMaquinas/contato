<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA CRÍTICO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff0000; --dark: #0a0a0a; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--dark); font-family: 'Poppins', sans-serif; }
        
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        .content { 
            position: relative; z-index: 2; display: flex; justify-content: center; 
            align-items: center; height: 100vh; flex-direction: column;
        }
        
        .msg-box { 
            background: rgba(18, 18, 18, 0.95); padding: 40px; border-radius: 15px; 
            text-align: center; border: 2px solid var(--primary); color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            min-width: 320px;
        }
        
        h1 { font-family: 'Orbitron', sans-serif; margin-bottom: 20px; font-size: 2rem; }
        
        /* Botão fixado no rodapé e MUITO transparente */
        .back-link { 
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 18px; 
            background: rgba(255, 0, 0, 0.2); 
            color: rgba(255, 255, 255, 0.4); 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.85rem;
            border: 1px solid rgba(255, 0, 0, 0.2);
            opacity: 0.15; /* Extremamente transparente */
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        .back-link:hover { 
            opacity: 0.7; /* Revela um pouco mais ao passar o mouse */
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="content">
        <div class="msg-box">
            <h1 id="title">Hackeando servidores</h1>
            <p id="desc" style="color: white;">Carregando...</p>
        </div>
    </div>

    <!-- Botão posicionado no final da página -->
    <a href="index.html" class="back-link">VOLTAR AO SISTEMA</a>

    <script>
        // Alternar mensagem após 5 segundos (5000 ms)
        setTimeout(() => {
            document.getElementById('title').innerText = "Easter Egg Ativado!";
            document.getElementById('desc').innerText = "Exploit carregado.";
        }, 5000);

        // Efeito Matrix Vermelho
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0110"; 
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FF0000'; 
            ctx.font = fontSize + 'px monospace';
            
            drops.forEach((y, i) => {
                let text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
