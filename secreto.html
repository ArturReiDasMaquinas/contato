<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA CRÍTICO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff0000; --dark: #0a0a0a; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--dark); font-family: 'Poppins', sans-serif; }
        
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        #video-meme { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; 
            z-index: 1; display: none; cursor: pointer;
        }

        .content { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; pointer-events: none; }
        .contact-card { background: rgba(18, 18, 18, 0.9); padding: 40px; border-radius: 15px; text-align: center; border: 1px solid #440000; max-width: 400px; width: 90%; pointer-events: auto; }
        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); }
        .whatsapp-link { display: inline-block; padding: 15px 30px; background: var(--primary); color: white; text-decoration: none; font-weight: bold; border-radius: 5px; }
        
        #click-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; color: white;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <video id="video-meme" loop playsinline>
        <source src="video_.mp4" type="video/mp4">
    </video>

    <div id="click-overlay"><h1>CLIQUE PARA CARREGAR O SISTEMA</h1></div>

    <div class="content">
        <div class="contact-card">
            <h2>AVISO</h2>
            <p style="color: white;">Sistema em modo crítico. Aguardando input...</p>
            <br>
            <a href="index.html" class="whatsapp-link">RETORNAR</a>
        </div>
    </div>

    <script>
        // Efeito Matrix
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0110"; 
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FF0000'; 
            ctx.font = fontSize + 'px monospace';
            drops.forEach((y, i) => {
                let text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        // Lógica de áudio e vídeo
        const video = document.getElementById('video-meme');
        const overlay = document.getElementById('click-overlay');

        setTimeout(function() {
            overlay.style.display = 'flex'; // Mostra o aviso para clicar
        }, 180000); // 3 minutos

        overlay.addEventListener('click', function() {
            overlay.style.display = 'none';
            video.style.display = 'block';
            video.play();
            console.log("Codigo Ativado!");
        });
    </script>
</body>
</html>
