<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CRÍTICO | Senhor dos Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000; /* Mudamos para Vermelho */
            --dark: #0a0a0a;
            --light: #ffffff;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background-color: var(--dark); }

        /* Vídeo de fundo - inicialmente invisível */
        #video-meme {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none; /* Escondido até o tempo acabar */
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .contact-card { 
            background: rgba(18, 18, 18, 0.9); /* Um pouco transparente para ver o vídeo depois */
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            border: 1px solid #330000;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 20px; }
        .info { margin: 25px 0; border-top: 1px solid #440000; border-bottom: 1px solid #440000; padding: 20px 0; color: white;}
        
        .whatsapp-link { 
            display: inline-block; 
            padding: 15px 30px; 
            background: var(--primary); 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px; 
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <video id="video-meme" autoplay loop muted playsinline>
        <source src="seu-video.mp4" type="video/mp4">
    </video>

    <section>
        <div class="contact-card">
            <h2>AVISO</h2>
            <p>Você entrou no modo de depuração do sistema.</p>
            <div class="info">
                <p>⚠️ Status: <strong>Aguardando Resposta...</strong></p>
                <p>📞 Contato de Emergência: <strong>(69) 9201-8730</strong></p>
            </div>
            <a href="index.html" class="whatsapp-link">VOLTAR AO NORMAL</a>
        </div>
    </section>

    <script>
        // O "Pulo do Gato": Depois de 10 minutos (600.000ms), o vídeo aparece
        setTimeout(function() {
            var video = document.getElementById('video-meme');
            video.style.display = 'block';
            console.log("Meme ativado!");
        }, 600000); // 10 minutos certinhos
    </script>

</body>
</html>
